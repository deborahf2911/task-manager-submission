services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/tasks.sqlite
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  api-data: